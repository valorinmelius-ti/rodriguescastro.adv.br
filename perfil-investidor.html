:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --ink: #142621;
  --muted: #4F625C;
  --line: #C9D6D1;
  --pine: #1D5C4E;
  --on-pine: #FFFFFF;
  --pine-soft: #E0ECE7;
  --brass: #A47720;
  --brass-soft: #F4EBD6;
  --danger: #A23B2A;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1714;
    --surface: #15211D;
    --ink: #E4EDE9;
    --muted: #A3B5AE;
    --line: #2C3D37;
    --pine: #82C8B3;
    --on-pine: #0E1714;
    --pine-soft: #1A3730;
    --brass: #D9B062;
    --brass-soft: #2E2716;
    --danger: #F08C78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1714;
  --surface: #15211D;
  --ink: #E4EDE9;
  --muted: #A3B5AE;
  --line: #2C3D37;
  --pine: #82C8B3;
  --on-pine: #0E1714;
  --pine-soft: #1A3730;
  --brass: #D9B062;
  --brass-soft: #2E2716;
  --danger: #F08C78;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 1.1875rem;
  line-height: 1.55;
}
.wrap { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
img { max-width: 100%; }

.brand {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: .875rem 1.5rem;
  padding-bottom: .875rem; margin-bottom: 1.75rem;
  border-bottom: 1px solid var(--line);
  font-size: .9375rem; line-height: 1.35; color: var(--muted);
}
.brand strong { color: var(--ink); font-size: 1.0625rem; }
.who { display: flex; flex-direction: column; }
.seals { display: flex; gap: 12px; }
.seals img { display: block; width: 64px; height: auto; }

h1 {
  font-size: clamp(2rem, 8vw, 2.75rem);
  line-height: 1.08; letter-spacing: -0.015em;
  margin: 0 0 1rem;
}
h1:focus, h2:focus { outline: none; }
h2 { font-size: 1.375rem; line-height: 1.25; margin: 2.25rem 0 .75rem; }
p { margin: 0 0 1rem; max-width: 34em; }
.small { font-size: 1rem; color: var(--muted); }

/* Progresso: 20 marcas agrupadas pelos três blocos */
.progress { margin-bottom: 1.5rem; }
.ticks { display: flex; gap: .625rem; margin-bottom: .625rem; }
.group { display: flex; gap: 3px; }
.tick { flex: 1; height: 7px; border-radius: 4px; background: var(--line); }
.tick.done { background: var(--brass); }
.tick.now { background: var(--pine); }
.where { display: flex; justify-content: space-between; gap: 1rem; font-size: .9375rem; color: var(--muted); }
.where b { color: var(--ink); font-weight: 700; }

.q-text {
  font-size: clamp(1.375rem, 5.4vw, 1.75rem);
  line-height: 1.3; font-weight: 700;
  margin: 0 0 .5rem;
}
.q-hint { font-size: 1rem; color: var(--muted); margin: 0 0 1.25rem; }
.options { margin-top: 1.25rem; }
.opt {
  display: flex; align-items: flex-start; gap: .875rem;
  width: 100%; min-height: 3.5rem;
  margin: 0 0 .75rem; padding: 1rem 1.125rem;
  text-align: left; font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px;
  cursor: pointer;
  transition: border-color .12s ease, background-color .12s ease;
}
@media (hover: hover) { .opt:hover { border-color: var(--muted); } }
button { -webkit-tap-highlight-color: transparent; }
.opt .dot {
  flex: none; width: 1.375rem; height: 1.375rem; margin-top: .14rem;
  border-radius: 50%; border: 2px solid var(--muted);
  background: var(--surface);
}
.opt[aria-checked="true"] { border-color: var(--pine); background: var(--pine-soft); }
.opt[aria-checked="true"] .dot { border-color: var(--pine); background: var(--pine); box-shadow: inset 0 0 0 3px var(--surface); }

button, input, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 3.25rem; padding: .8rem 1.5rem;
  border-radius: 10px; border: 0;
  background: var(--pine); color: var(--on-pine);
  font-weight: 700; cursor: pointer;
}
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.quiet { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.wide { width: 100%; }
.link {
  background: none; border: 0; padding: .25rem 0;
  color: var(--pine); text-decoration: underline; text-underline-offset: 3px;
  cursor: pointer; font-size: 1rem;
}
.nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1.75rem; }
.nav .btn:only-child { margin-left: auto; }

label.field { display: block; font-weight: 700; margin: 1.5rem 0 .5rem; }
input[type="text"], input[type="tel"], textarea {
  width: 100%; padding: .85rem 1rem;
  color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 10px;
}
input[type="text"]:focus, input[type="tel"]:focus, textarea:focus { border-color: var(--pine); }
textarea { min-height: 9rem; resize: vertical; font-size: 1rem; line-height: 1.45; }
.error { color: var(--danger); font-size: 1rem; margin-top: .5rem; min-height: 1.5rem; }
.status { font-size: 1rem; color: var(--muted); margin-top: .625rem; }
.status:empty { display: none; }
#msg { min-height: 14rem; }

.notice {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 1rem 1.125rem; margin: 0 0 1.5rem;
}
.notice p { margin-bottom: .75rem; }
.notice .row { display: flex; flex-wrap: wrap; gap: .75rem; }

.check { display: flex; gap: .875rem; align-items: flex-start; margin: 1.5rem 0; cursor: pointer; }
.check input { width: 1.5rem; height: 1.5rem; margin: .15rem 0 0; flex: none; accent-color: var(--pine); }

.review { list-style: none; padding: 0; margin: 1.5rem 0 0; border-top: 1px solid var(--line); }
.review li { border-bottom: 1px solid var(--line); }
.review button {
  display: grid; grid-template-columns: 2rem 1fr; gap: .5rem;
  width: 100%; padding: .875rem 0; text-align: left;
  background: none; border: 0; color: var(--ink); cursor: pointer; font-size: 1rem;
}
.review .n { color: var(--muted); font-weight: 700; }
.review .a { display: block; color: var(--pine); margin-top: .2rem; }

/* Resultado */
.kicker { font-size: 1rem; color: var(--muted); margin: 0 0 .25rem; }
.profile-name {
  font-size: clamp(2.5rem, 12.5vw, 4.5rem);
  line-height: .95; letter-spacing: -0.025em;
  color: var(--pine); margin: 0 0 1rem;
}
.scale { position: relative; margin: 3rem 0 1.75rem; }
.bands { display: grid; grid-template-columns: 20.5fr 20fr 19.5fr; gap: 4px; }
.band { height: 12px; background: var(--line); border-radius: 3px; }
.band.on { background: var(--pine); }
.band-labels { display: grid; grid-template-columns: 20.5fr 20fr 19.5fr; gap: 4px; margin-top: .5rem; font-size: .9375rem; color: var(--muted); }
.band-labels span:nth-child(2) { text-align: center; }
.band-labels span:nth-child(3) { text-align: right; }
.band-labels .on { color: var(--ink); font-weight: 700; }
.marker { position: absolute; top: -2.1rem; width: 2px; height: 2.1rem; margin-left: -1px; }
.marker span { position: absolute; top: 0; left: 0; font-size: .875rem; font-weight: 700; white-space: nowrap; background: var(--brass-soft); color: var(--ink); padding: .1rem .5rem; border-radius: 6px; }
.marker i { position: absolute; left: 0; bottom: -.2rem; width: 2px; height: 1.1rem; background: var(--brass); }

.facts { display: grid; gap: 0; margin: 1.5rem 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 1fr; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.facts dt { font-size: .9375rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; }
@media (min-width: 34rem) {
  .facts div { grid-template-columns: 13rem 1fr; align-items: baseline; }
}
.adjust { border-left: 4px solid var(--brass); background: var(--brass-soft); padding: .875rem 1rem; border-radius: 0 10px 10px 0; margin: 1.5rem 0; }
.adjust p { margin-bottom: .5rem; font-size: 1rem; }
.adjust ul { margin: 0; padding-left: 1.25rem; font-size: 1rem; }
.send { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 1.25rem; margin-top: 1rem; }
.send p { font-size: 1rem; }
.send textarea { margin: .25rem 0 .75rem; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.foot { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }

.back {
  display: inline-flex; align-items: center; gap: .375rem;
  min-height: 2.75rem; margin: -.25rem 0 .5rem;
  font-size: .9375rem; color: var(--pine);
  text-decoration: underline; text-underline-offset: 3px;
}
a.btn { text-decoration: none; text-align: center; }
.send .field { margin: .25rem 0 0; }
.send input[type="tel"] { font-size: 1.25rem; letter-spacing: .02em; }
.send .error:empty { min-height: 0; margin: 0; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.ok { border-left: 4px solid var(--pine); background: var(--pine-soft); padding: 1rem 1.125rem; border-radius: 0 10px 10px 0; }
.ok p { margin: 0 0 .5rem; }
.ok p:last-child { margin-bottom: 0; }
.fail { border-left: 4px solid var(--brass); background: var(--brass-soft); padding: 1rem 1.125rem; border-radius: 0 10px 10px 0; }
.fail p { font-size: 1rem; margin-bottom: .75rem; }
/* Selos ANBIMA: no fundo escuro, base branca com a área de não interferência (h/6) do guia de uso */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .seals { background: #fff; padding: 11px; border-radius: 8px; }
}
:root[data-theme="dark"] .seals { background: #fff; padding: 11px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ---------- Cálculo ---------- */
function compute(answers) {
  var pts = answers.map(function (a, i) { return Q[i].o[a - 1][1]; });
  var sum = function (a, b) { var t = 0; for (var i = a; i <= b; i++) t += pts[i]; return t; };
  var total = sum(0, 19), K = sum(0, 2), Bh = sum(3, 10), R = sum(11, 14), H = sum(15, 19);
  var base = total <= 40 ? 0 : total <= 60 ? 1 : 2;
  var knowledge = K <= 5 ? 0 : K <= 9 ? 1 : 2;
  var p = function (n) { return pts[n - 1]; };
  var caps = [];
  if (p(4) === 1) caps.push([0, "Diante de uma queda de 15%, venderia tudo."]);
  if (p(13) === 1) caps.push([0, "Não aceita perdas no período de um ano."]);
  if (p(15) === 1) caps.push([0, "Uma perda comprometeria as despesas do dia a dia."]);
  if (p(17) === 1) caps.push([0, "Prazo do investimento de até 1 ano."]);
  if (p(18) === 1) caps.push([0, "Pode precisar de mais da metade do valor nos próximos 12 meses."]);
  if (p(17) === 2) caps.push([1, "Prazo do investimento de 1 a 2 anos."]);
  if (knowledge === 0) caps.push([1, "Conhecimento sobre investimentos em nível básico."]);
  if (p(14) === 1) caps.push([1, "Não há reserva de emergência separada."]);
  if (p(7) === 1) caps.push([1, "Uma queda de 5% já causa muita preocupação."]);
  var final = base, reasons = [];
  caps.forEach(function (c) { if (c[0] < base) { reasons.push(c[1]); if (c[0] < final) final = c[0]; } });
  var horizon = p(17) <= 2 ? 0 : p(17) === 3 ? 1 : 2;
  var liquidity = (p(18) === 1 || p(19) === 1 || p(20) === 1) ? 2 : (p(18) === 2 || p(19) === 2 || p(20) === 2) ? 1 : 0;
  return { pts: pts, total: total, K: K, Bh: Bh, R: R, H: H, base: base, profile: final, knowledge: knowledge,
           horizon: horizon, liquidity: liquidity, reasons: reasons };
}

/* ---------- Código das respostas ---------- */
function b64urlEncode(str) {
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function checksum(s) {
  var t = 0;
  for (var i = 0; i < s.length; i++) t = (t + s.charCodeAt(i) * (i + 1)) % 97;
  return (t < 10 ? "0" : "") + t;
}
function ymd(d) {
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
}
function makeCode(name, answers, date) {
  var body = "PI2." + answers.join("") + "." + ymd(date) + "." + b64urlEncode(name.trim());
  return body + "." + checksum(body);
}
function parseCode(text) {
  var m = /PI2\.([1-4]{20})\.(\d{8})\.([A-Za-z0-9_-]*)\.(\d{2})/.exec(text || "");
  if (!m && /PI1\.[1-4]{20}\./.test(text || "")) return { error: "Este código é da versão anterior do questionário. Peça à cliente para responder de novo pelo link." };
  if (!m) return { error: "Não encontrei um código de respostas no texto. Ele começa com PI2." };
  var body = m[0].slice(0, m[0].lastIndexOf("."));
  if (checksum(body) !== m[4]) return { error: "O código parece incompleto ou alterado. Peça à cliente para copiar a mensagem de novo." };
  var name;
  try { name = b64urlDecode(m[3]); } catch (e) { return { error: "Não consegui ler o nome dentro do código." }; }
  var y = +m[2].slice(0, 4), mo = +m[2].slice(4, 6), d = +m[2].slice(6, 8);
  return { name: name, answers: m[1].split("").map(Number), date: new Date(y, mo - 1, d, 12, 0, 0), code: m[0] };
}

    "Perfil: " + PROFILES[r.profile].name + " (" + r.total + " de 80 pontos)\n" +
    "Conhecimento: " + KNOWLEDGE[r.knowledge] + "\n" +
    "Horizonte: " + HORIZONS[r.horizon].name + "\n" +
    "Código das respostas: " + code;
}
function emailPayload(name, answers, r, date, code, phone) {
  var prof = PROFILES[r.profile].name;
  var p = {
    _subject: "[Perfil do investidor] " + name + " — " + prof + " (" + r.total + " de 80)",
    _template: "table",
    _captcha: "false",
    "Nome": name,
    "WhatsApp": fmtPhone(phone),
    "Responder pelo WhatsApp": "https://wa.me/55" + phone,
    "Perfil": prof,
    "Pontuação total": r.total + " de 80 pontos",
    "Ajustes de cautela": r.reasons.length
      ? "A pontuação indica perfil " + PROFILES[r.base].name.toLowerCase() + ", ajustado para " + prof.toLowerCase() + ": " + r.reasons.join(" ")
      : "Nenhum. O perfil corresponde à pontuação total.",
    "Conhecimento": KNOWLEDGE[r.knowledge] + " (" + r.K + " de 12 pontos)",
    "Comportamento": r.Bh + " de 32 pontos",
    "Perfil de risco": r.R + " de 16 pontos",
    "Horizonte e liquidez": r.H + " de 20 pontos",
    "Horizonte de investimento": HORIZONS[r.horizon].name + ", " + HORIZONS[r.horizon].range,
    "Necessidade de liquidez": LIQUIDITY[r.liquidity],
    "Respondido em": fmtDateTime(date),
    "Declaração": "Aceita: “" + DECLARATION + "”"
  };
  Q.forEach(function (q, i) {
    var o = q.o[answers[i] - 1];
    p["Pergunta " + pad2(i + 1)] = q.t + " → " + o[0] + " (" + o[1] + (o[1] === 1 ? " ponto)" : " pontos)");
  });
  p["Código das respostas"] = code;
  p["Relatório em PDF"] = "Abra rodriguescastro.adv.br/perfil-investidor, toque em “Sou o consultor e recebi um código de respostas” e cole o código acima.";
  return p;
}

function renderSendBox(r, date, code) {
  var box = document.getElementById("sendbox");
  if (!box) return;
  if (state.sentAt) {
    box.innerHTML = '<div class="ok"><p><b>Resultado enviado.</b> O Flávio recebeu as suas respostas por e-mail e vai falar com você pelo WhatsApp ' +
      esc(fmtPhone(state.phone)) + '.</p><p class="small">Enviado em ' + esc(fmtDateTime(new Date(state.sentAt))) + '.</p></div>';
    return;
  }
  box.innerHTML =
    '<p>Informe o seu WhatsApp e toque em <b>Enviar resultado</b>. As respostas chegam direto no e-mail do Flávio, e ele fala com você pelo WhatsApp.</p>' +
    '<label class="field" for="phone">Seu WhatsApp com DDD</label>' +
    '<input type="tel" id="phone" inputmode="tel" autocomplete="tel-national" placeholder="(92) 91234-5678" maxlength="20" value="' + esc(fmtPhone(state.phone)) + '">' +
    '<input type="text" class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<div class="error" id="phoneerr" role="alert"></div>' +
    '<button class="btn wide" id="send">Enviar resultado</button>' +
    '<div class="status" id="sendstatus" role="status"></div>' +
    '<div id="sendfail"></div>' +
    '<p class="small" style="margin:0">Seu número é usado só para o Flávio falar com você sobre o resultado.</p>';
  var input = document.getElementById("phone"), err = document.getElementById("phoneerr");
  var btn = document.getElementById("send"), st = document.getElementById("sendstatus"), fail = document.getElementById("sendfail");
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") btn.click(); });
  input.addEventListener("input", function () { if (err.textContent) err.textContent = ""; });
  btn.onclick = function () {
    var d = phoneDigits(input.value);
    if (!phoneValid(d)) {
      err.textContent = "Confira o número: informe o DDD e o número do WhatsApp, por exemplo (92) 91234-5678.";
      input.focus(); return;
    }
    err.textContent = ""; fail.innerHTML = "";
    state.phone = d; persist();
    btn.disabled = true; st.textContent = "Enviando…";
    var payload = emailPayload(state.name, state.answers, r, date, code, d);
    payload._honey = document.getElementById("hp").value;
    fetch(SEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (j) {
          if (!res.ok || String(j.success) !== "true") throw new Error(j.message || "falha");
        });
      })
      .then(function () {
        state.sentAt = new Date().toISOString(); persist();
        renderSendBox(r, date, code);
      })
      .catch(function () {
        btn.disabled = false; st.textContent = "";
        var wa = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(waMessage(state.name, r, code));
        fail.innerHTML = '<div class="fail"><p>Não consegui enviar agora. Toque abaixo para mandar o resultado pelo WhatsApp: a mensagem já vai pronta. Se preferir, tente enviar de novo em alguns minutos.</p>' +
          '<a class="btn wide" href="' + esc(wa) + '" target="_blank" rel="noopener">Enviar pelo WhatsApp</a></div>';
      });
  };
}

function renderResult() {
  var r = compute(state.answers);
  var date = state.finishedAt ? new Date(state.finishedAt) : new Date();
  var code = makeCode(state.name, state.answers, date);
  show(
    resultHTML(state.name, r, { kicker: "Resultado de " + firstName(state.name) }) +
    "<h2>Envie o resultado ao Flávio</h2>" +
    '<div class="send stack" id="sendbox"></div>' +
    '<div class="stack" style="margin-top:1rem">' + pdfBlock(true) + "</div>" +
    '<div class="foot"><button class="link" id="again">Refazer o questionário</button></div>'
  );
  renderSendBox(r, date, code);
  wirePDF(state.name, state.answers, r, date, code, true);
  document.getElementById("again").onclick = function () {
    if (confirmAgain()) { state = blank(); wipe(); renderIntro(); }
  };
}
function confirmAgain() {
  try { return window.confirm("Apagar as respostas deste aparelho e começar de novo?"); } catch (e) { return true; }
}

function wireCopy() {
  var ta = document.getElementById("msg"), st = document.getElementById("copystatus");
  document.getElementById("copy").onclick = function () {
    var text = ta.value;
    var fallback = function () {
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      st.textContent = ok ? "Mensagem copiada. Agora cole no WhatsApp ou no e-mail." : "Texto selecionado. Toque e segure sobre ele e escolha Copiar.";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { st.textContent = "Mensagem copiada. Agora cole no WhatsApp ou no e-mail."; }, fallback);
    } else fallback();
  };
}

function renderConsultant(prefill, err) {
  show(
    "<h1>Abrir respostas recebidas</h1>" +
    "<p>Cole a mensagem que a cliente enviou. O relatório completo, com todas as respostas, será refeito a partir do código.</p>" +
    '<label class="field" for="paste">Mensagem ou código</label>' +
    '<textarea id="paste" spellcheck="false">' + esc(prefill || "") + "</textarea>" +
    '<div class="error" id="err">' + esc(err || "") + "</div>" +
    '<div class="nav"><button class="btn quiet" id="back">Voltar</button><button class="btn" id="read">Gerar relatório</button></div>'
  );
  document.getElementById("back").onclick = function () { route(); };
  document.getElementById("read").onclick = function () {
    var text = document.getElementById("paste").value;
    var c = parseCode(text);
    if (c.error) { document.getElementById("err").textContent = c.error; return; }
    renderConsultantResult(c);
  };
}

function renderConsultantResult(c) {
  var r = compute(c.answers);
  show(
    resultHTML(c.name, r, { kicker: "Relatório de " + c.name + ", respondido em " + fmtDate(c.date) }) +
    "<h2>Relatório completo</h2>" +
    '<div class="send stack">' + pdfBlock() +
    '<p class="small" id="nodl">O PDF inclui as 20 respostas, a pontuação de cada bloco e os critérios usados.</p></div>' +
    '<div class="foot"><button class="link" id="other">Ler outro código</button></div>'
  );
  wirePDF(c.name, c.answers, r, c.date, c.code, false);
  document.getElementById("other").onclick = function () { renderConsultant(""); };
}

/* ---------- PDF ---------- */
function buildPDF(name, answers, r, date, code, withTime) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: "mm", format: "a4" });
  var M = 18, W = 210 - 2 * M, BOTTOM = 297 - 18, y = 18;
  var PINE = [29, 92, 78], INK = [20, 38, 33], MUTED = [79, 98, 92], BRASS = [164, 119, 32], LINE = [201, 214, 209], SOFT = [234, 242, 238];
  var mm = function (pt) { return pt * 0.3528; };
  function font(size, style, color) { doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); doc.setTextColor.apply(doc, color || INK); }
  function ensure(h) { if (y + h > BOTTOM) { doc.addPage(); y = 18; } }
  function text(str, size, style, color, opts) {
    opts = opts || {};
    font(size, style, color);
    var x = opts.x || M, width = opts.w || (W - (x - M));
    var lines = doc.splitTextToSize(str, width), lh = mm(size) * 1.38;
    ensure(lines.length * lh);
    doc.text(lines, x, y, { baseline: "top", lineHeightFactor: 1.38 });
    y += lines.length * lh + (opts.gap == null ? 1.5 : opts.gap);
  }
  function heading(str) { ensure(14); y += 4; text(str, 12, "bold", PINE, { gap: 2 }); }

  // Cabeçalho
  text("Análise de Perfil do Investidor", 20, "bold", PINE, { gap: 1, w: W - 56 });
  var seals = document.querySelectorAll(".seals img"), SW = 15, SG = 3;
  for (var k = 0; k < seals.length; k++) {
    try { doc.addImage(seals[k].src, "PNG", M + W - seals.length * SW - (seals.length - 1) * SG + k * (SW + SG), 16, SW, SW, "selo" + k, "FAST"); } catch (e) {}
  }
  text("Flávio Rodrigues | Consultor de Investimentos registrado na CVM", 10, "normal", MUTED, { gap: 0.5, w: W - 56 });
  text("Certificação CGINV III (Totum)", 10, "normal", MUTED, { gap: 3, w: W - 56 });
  doc.setDrawColor.apply(doc, BRASS); doc.setLineWidth(0.6); doc.line(M, y, M + W, y); y += 5;

  text("Investidor(a): " + name, 11, "bold", INK, { gap: 1 });
  text("Data das respostas: " + (withTime ? fmtDateTime(date) : fmtDate(date)), 10, "normal", MUTED, { gap: 1 });
  text("Código das respostas: " + code, 8.5, "normal", MUTED, { gap: 5 });

  // Quadro do resultado
  var rows = [
    ["Pontuação total", r.total + " de 80 pontos"],
    ["Conhecimento", KNOWLEDGE[r.knowledge] + " (" + r.K + " de 12 pontos)"],
    ["Horizonte de investimento", HORIZONS[r.horizon].name + ", " + HORIZONS[r.horizon].range],
    ["Necessidade de liquidez", LIQUIDITY[r.liquidity]]
  ];
  var boxH = 16 + rows.length * 7 + 4;
  ensure(boxH);
  doc.setFillColor.apply(doc, SOFT); doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.3);
  doc.roundedRect(M, y, W, boxH, 2.5, 2.5, "FD");
  var top = y;
  font(10, "normal", MUTED); doc.text("Perfil de risco", M + 6, top + 5, { baseline: "top" });
  font(18, "bold", PINE); doc.text(PROFILES[r.profile].name, M + 6, top + 9.5, { baseline: "top" });
  rows.forEach(function (row, k) {
    var ry = top + 18 + k * 7;
    font(10, "normal", MUTED); doc.text(row[0], M + 6, ry, { baseline: "top" });
    font(10, "bold", INK); doc.text(row[1], M + 62, ry, { baseline: "top" });
  });
  y = top + boxH + 4;
  text(PROFILES[r.profile].text, 10, "normal", INK, { gap: 2 });

  heading("Pontuação por bloco");
  [["Conhecimento (perguntas 1 a 3)", r.K, 12],
   ["Comportamento (perguntas 4 a 11)", r.Bh, 32],
   ["Perfil de risco (perguntas 12 a 15)", r.R, 16],
   ["Horizonte e liquidez (perguntas 16 a 20)", r.H, 20]].forEach(function (b) {
    ensure(6);
    font(10, "normal", INK); doc.text(b[0], M, y, { baseline: "top" });
    font(10, "bold", INK); doc.text(b[1] + " de " + b[2], M + W, y, { baseline: "top", align: "right" });
    y += 6;
  });

  heading("Ajustes de cautela");
  if (r.reasons.length) {
    text("A pontuação total indica perfil " + PROFILES[r.base].name.toLowerCase() + ". O perfil foi ajustado para " +
      PROFILES[r.profile].name.toLowerCase() + " pelos seguintes motivos:", 10, "normal", INK, { gap: 1.5 });
    r.reasons.forEach(function (t) { text("- " + t, 10, "normal", INK, { x: M + 3, gap: 1 }); });
  } else {
    text("Nenhum ajuste foi necessário: o perfil corresponde à pontuação total.", 10, "normal", INK);
  }

  heading("Critérios de classificação");
  text("Pontuação total: de 20 a 40, conservador; de 41 a 60, moderado; de 61 a 80, arrojado. Conhecimento (perguntas 1 a 3): de 3 a 5, básico; de 6 a 9, intermediário; de 10 a 12, avançado. Horizonte: conforme o prazo informado na pergunta 17. Quando uma resposta indica necessidade de mais cautela do que a pontuação (por exemplo, venda de tudo diante de uma queda, prazo curto, dinheiro necessário para as despesas do dia a dia, falta de reserva de emergência ou conhecimento básico), prevalece o perfil mais conservador.", 9.5, "normal", INK);

  heading("Respostas");
  Q.forEach(function (q, i) {
    var opt = q.o[answers[i] - 1];
    font(9, "bold", INK);
    var ql = doc.splitTextToSize((i + 1) + ". " + q.t, W);
    font(9, "normal", INK);
    var al = doc.splitTextToSize(opt[0] + " (" + opt[1] + (opt[1] === 1 ? " ponto)" : " pontos)"), W - 5);
    ensure((ql.length + al.length) * mm(9) * 1.38 + 3);
    text((i + 1) + ". " + q.t, 9, "bold", INK, { gap: 0.4 });
    text(opt[0] + " (" + opt[1] + (opt[1] === 1 ? " ponto)" : " pontos)"), 9, "normal", PINE, { x: M + 5, gap: 2.2 });
  });

  ensure(52);
  heading("Declaração");
  text("O(a) investidor(a) declarou: “" + DECLARATION + "”", 10, "normal", INK, { gap: 2 });
  text("Questionário de análise do perfil do investidor (suitability), conforme a Resolução CVM nº 30/2021. O perfil deve ser revisto periodicamente e sempre que houver mudança relevante na situação financeira, nos objetivos ou no prazo dos investimentos.", 9, "normal", MUTED, { gap: 4 });

  y += 12;
  doc.setDrawColor.apply(doc, INK); doc.setLineWidth(0.3);
  var half = (W - 12) / 2;
  doc.line(M, y, M + half, y); doc.line(M + half + 12, y, M + W, y);
  font(9, "normal", MUTED);
  doc.text(name, M, y + 2, { baseline: "top", maxWidth: half });
  doc.text("Flávio Rodrigues, CFG, CGA, CGE, CGINV III", M + half + 12, y + 2, { baseline: "top", maxWidth: half });

  var n = doc.getNumberOfPages();
  for (var p = 1; p <= n; p++) {
    doc.setPage(p);
    font(8, "normal", MUTED);
    doc.text("Perfil do investidor de " + name, M, 297 - 10);
    doc.text("Página " + p + " de " + n, M + W, 297 - 10, { align: "right" });
  }
  doc.setProperties({ title: "Análise de Perfil do Investidor | " + name, author: "Flávio Rodrigues" });
  return doc.output("blob");
}

/* ---------- Navegação ---------- */
function route() {
  if (state.step >= 1 && state.step <= 20 && (state.step === 1 || state.answers[state.step - 2] || state.reviewing)) return renderQuestion(state.step - 1);
  if (state.step === 21 && firstUnanswered() === 20) return renderConfirm();
  if (state.step === 22 && firstUnanswered() === 20 && state.declared) return renderResult();
  if (state.step > 0 && firstUnanswered() < 20) { state.step = firstUnanswered() + 1; return renderQuestion(state.step - 1); }
  renderIntro();
}

window.__perfil = { compute: compute, makeCode: makeCode, parseCode: parseCode, Q: Q };
route();
})();
</script>
